<!-- Necesario para que "Añadir a pantalla de inicio" abra la web en modo
     standalone (pantalla completa, sin la barra de Safari) — sin esto,
     navigator.standalone nunca es true y las notificaciones push de iPhone
     no se pueden activar. En Android, el manifest.json es uno de los
     requisitos para que Chrome ofrezca instalar la PWA. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4A9FD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CNPN">
<link rel="apple-touch-icon" href="assets/img/applogo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
